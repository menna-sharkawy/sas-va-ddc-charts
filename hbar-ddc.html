<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal bar – SAS VA DDC</title>
<!--
  SAS Visual Analytics – Data-Driven Content (DDC)
  مخطط أعمدة أفقي: فئة واحدة + مقياس واحد.

  Roles → Variables (بالترتيب):
    1) عمود الفئة  (مثال: الجهة المبلغة)   ← سطر لكل قيمة
    2) المقياس      (مثال: عدد البلاغات)    ← طول العمود

  بدون مكتبات خارجية — يعمل على شبكة مغلقة. أضف ?debug=1 للرابط لعرض البيانات الواردة.
-->
<style>
  :root{ --ink:#1A1F1C; --ink-2:#4A524D; --muted:#6B736E; --track:#F3F5F3;
         --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif; }
  html,body{margin:0;height:100%;background:#FFFFFF;color:var(--ink);font-family:var(--font);overflow:hidden}
  #chart{position:absolute;inset:0}
  svg{display:block;width:100%;height:100%}
  .bar{cursor:pointer;transition:opacity .15s}
  .dim .bar{opacity:.3} .dim .bar.sel{opacity:1}
  .val{font-size:13px;font-weight:600;fill:var(--ink-2);font-variant-numeric:tabular-nums}
  .cat{font-size:13px;fill:var(--ink)}
  #tip{position:absolute;pointer-events:none;background:#1A1F1C;color:#fff;font-size:12.5px;line-height:1.7;padding:8px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8;padding:20px;white-space:pre-line}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .grow{transform-box:fill-box;transform-origin:right;animation:growX .5s cubic-bezier(.2,.7,.2,1) both}
  @media (prefers-reduced-motion: reduce){ .grow{animation:none} }
</style>
</head>
<body>
<div id="chart"><div id="tip"></div><div id="msg"></div></div>

<script>
/* ============================ الإعدادات ============================ */
var CONFIG = {
  color: '#B8955A',        // ذهبي
  showTrack: false,        // خلفية رمادية فاتحة خلف كل عمود
  sort: 'desc',            // 'desc' | 'asc' | 'none'
  maxCategories: 12,       // ما زاد يُدمج في «أخرى» (0 = بدون دمج)
  otherLabel: 'أخرى',
  compact: true,           // 919,393,775 ← 919.4 مليون
  decimals: 1,
  unit: '',                // وحدة اختيارية بعد الرقم، مثل: 'بلاغ' أو 'ر.س'
  barMaxHeight: 26,        // أقصى سُمك للعمود بالبكسل
  labelMaxWidth: 0.35,     // أقصى عرض لعمود التسميات (نسبة من العرض)
  locale: 'en-US'
};

/* ============================ الحالة ============================ */
var state = { resultName: null, model: null, selected: {} };
var chartEl = document.getElementById('chart'), tipEl = document.getElementById('tip'), msgEl = document.getElementById('msg');
var SVGNS = 'http://www.w3.org/2000/svg';
var inVA = window.parent && window.parent !== window;
var DEBUG = /[?&]debug=1/.test(location.search);

/* ======================= الاتصال مع SAS VA ======================= */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d || typeof d !== 'object' || !d.hasOwnProperty('data')) return;
  if (DEBUG) showDebug(d);
  state.resultName = d.resultName;
  state.selected = {};
  var m = buildModel(Array.isArray(d.columns) ? d.columns : [], Array.isArray(d.data) ? d.data : []);
  if (m.error) { state.model = null; showMessage(m.error); postToVA({ resultName: state.resultName, message: m.error }); return; }
  state.model = m; msgEl.style.display = 'none'; render(true);
});

function postToVA(msg) {
  if (!inVA || !state.resultName) return;
  var target = '*';
  try { if (document.referrer) target = new URL(document.referrer).origin; } catch (x) {}
  window.parent.postMessage(msg, target);
}

/* ========================= نموذج البيانات ========================= */
var NUM = { number: 1, double: 1, numeric: 1, integer: 1, int: 1, decimal: 1, currency: 1 };
function isNum(c, rows, i) {
  if (c.type) return !!NUM[String(c.type).toLowerCase()];
  for (var r = 0; r < rows.length; r++) { var v = rows[r][i]; if (v !== null && v !== undefined && v !== '') return typeof v === 'number'; }
  return false;
}

function buildModel(cols, rows) {
  var help = 'أسند في Roles → Variables:\n1) عمود الفئة\n2) مقياس واحد';
  if (rows.length && !Array.isArray(rows[0])) rows = rows.map(function (o) { return cols.map(function (c) { return o[c.name]; }); });
  var catCol = -1, valCol = -1;
  cols.forEach(function (c, i) { if (isNum(c, rows, i)) { if (valCol < 0) valCol = i; } else if (catCol < 0) catCol = i; });
  if (catCol < 0 || valCol < 0) return { error: help };
  if (!rows.length) return { error: 'لا توجد بيانات للمرشحات الحالية' };

  var index = {}, cats = [];
  rows.forEach(function (r, ri) {
    var k = r[catCol]; k = (k === null || k === undefined || k === '') ? '(فارغ)' : String(k).trim();
    if (!(k in index)) { index[k] = cats.length; cats.push({ label: k, v: 0, rows: [] }); }
    var v = Number(r[valCol]); if (isFinite(v)) cats[index[k]].v += v;
    cats[index[k]].rows.push(ri);
  });
  if (CONFIG.sort !== 'none') { var dir = CONFIG.sort === 'asc' ? 1 : -1; cats.sort(function (a, b) { return dir * (a.v - b.v); }); }
  if (CONFIG.maxCategories && cats.length > CONFIG.maxCategories) {
    var keep = cats.slice(0, CONFIG.maxCategories - 1), other = { label: CONFIG.otherLabel, v: 0, rows: [] };
    cats.slice(CONFIG.maxCategories - 1).forEach(function (c) { other.v += c.v; other.rows = other.rows.concat(c.rows); });
    cats = keep.concat([other]);
  }
  return { cats: cats, measure: cols[valCol].label || cols[valCol].name };
}

/* ============================ التنسيق ============================ */
function full(v) { return v.toLocaleString(CONFIG.locale, { maximumFractionDigits: 2 }); }
function short(v) {
  var s;
  if (!CONFIG.compact) s = full(v);
  else {
    var a = Math.abs(v), o = { minimumFractionDigits: 0, maximumFractionDigits: CONFIG.decimals };
    if (a >= 1e9) s = (v / 1e9).toLocaleString(CONFIG.locale, o) + ' مليار';
    else if (a >= 1e6) s = (v / 1e6).toLocaleString(CONFIG.locale, o) + ' مليون';
    else if (a >= 1e4) s = (v / 1e3).toLocaleString(CONFIG.locale, o) + ' ألف';
    else s = full(Math.round(v * 100) / 100);
  }
  return CONFIG.unit ? s + ' ' + CONFIG.unit : s;
}

/* ============================ الرسم ============================ */
function el(n, a, p) { var x = document.createElementNS(SVGNS, n); for (var k in a) x.setAttribute(k, a[k]); if (p) p.appendChild(x); return x; }

function render(animate) {
  var old = chartEl.querySelector('svg'); if (old) old.remove();
  var m = state.model; if (!m) return;
  var W = chartEl.clientWidth, H = chartEl.clientHeight; if (W < 80 || H < 40) return;

  var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': m.measure });
  svg.style.direction = 'ltr';
  var g = el('g', { class: Object.keys(state.selected).length ? 'dim' : '' }, svg);
  chartEl.insertBefore(svg, tipEl);

  // قياس عرض التسميات والقيم لتحديد المساحات
  var probe = el('text', { class: 'cat', x: 0, y: -100 }, g), labW = 0;
  m.cats.forEach(function (c) { probe.textContent = c.label; labW = Math.max(labW, probe.getComputedTextLength()); });
  probe.setAttribute('class', 'val'); var valW = 0;
  m.cats.forEach(function (c) { probe.textContent = short(c.v); valW = Math.max(valW, probe.getComputedTextLength()); });
  probe.remove();
  labW = Math.min(labW + 14, W * CONFIG.labelMaxWidth); valW += 12;

  var padX = 10, padY = 8;
  var right = W - padX - labW;           // بداية الأعمدة (من اليمين)
  var trackW = Math.max(20, right - padX - valW);
  var n = m.cats.length, slot = (H - padY * 2) / n;
  var bh = Math.max(6, Math.min(CONFIG.barMaxHeight, slot * 0.6));
  var max = 0; m.cats.forEach(function (c) { max = Math.max(max, c.v); }); if (max <= 0) max = 1;

  m.cats.forEach(function (c, i) {
    var cy = padY + slot * (i + 0.5), y = cy - bh / 2;
    var v = Math.max(0, c.v), w = v > 0 ? Math.max(2, trackW * v / max) : 0;
    var x = right - w, r = Math.min(5, bh / 2, w);

    if (CONFIG.showTrack) el('rect', { x: right - trackW, y: y, width: trackW, height: bh, rx: Math.min(5, bh / 2), fill: 'var(--track)' }, g);
    // مستطيل بزوايا دائرية في طرفه (اليسار) ومستقيم عند خط البداية (اليمين)
    var bar = el('path', {
      d: 'M' + right + ',' + y + 'H' + (x + r) + 'Q' + x + ',' + y + ' ' + x + ',' + (y + r) + 'V' + (y + bh - r) + 'Q' + x + ',' + (y + bh) + ' ' + (x + r) + ',' + (y + bh) + 'H' + right + 'Z',
      fill: CONFIG.color, class: 'bar' + (state.selected[c.label] ? ' sel' : '') + (animate ? ' grow' : '')
    }, g);
    if (animate) bar.style.animationDelay = (i * 35) + 'ms';
    bar.addEventListener('mousemove', function (ev) { showTip(ev, c); });
    bar.addEventListener('mouseleave', function () { tipEl.style.opacity = 0; });
    bar.addEventListener('click', function (ev) { ev.stopPropagation(); select(c, ev.ctrlKey || ev.metaKey || ev.shiftKey); });

    var vt = el('text', { x: x - 8, y: cy + 4.5, 'text-anchor': 'end', class: 'val' }, g); vt.textContent = short(v);
    var lb = el('text', { x: W - padX, y: cy + 4.5, 'text-anchor': 'end', class: 'cat' }, g);
    lb.textContent = c.label;
    var s = c.label;
    while (s.length > 2 && lb.getComputedTextLength() > labW - 14) { s = s.slice(0, -1); lb.textContent = s + '…'; }
    if (s !== c.label) { var tt = el('title', {}, lb); tt.textContent = c.label; }
  });

  svg.addEventListener('click', function () {
    if (Object.keys(state.selected).length) { state.selected = {}; postToVA({ resultName: state.resultName, selections: [] }); render(false); }
  });
}

/* ============================ التفاعل ============================ */
function select(c, additive) {
  if (additive) { if (state.selected[c.label]) delete state.selected[c.label]; else state.selected[c.label] = true; }
  else { var only = state.selected[c.label] && Object.keys(state.selected).length === 1; state.selected = {}; if (!only) state.selected[c.label] = true; }
  var rows = []; state.model.cats.forEach(function (x) { if (state.selected[x.label]) rows = rows.concat(x.rows); });
  postToVA({ resultName: state.resultName, selections: rows.map(function (r) { return { row: r }; }) });
  render(false);
}

function showTip(ev, c) {
  tipEl.innerHTML = '';
  var h = document.createElement('div'); h.style.fontWeight = '600'; h.textContent = c.label; tipEl.appendChild(h);
  var d = document.createElement('div'); d.textContent = state.model.measure + ': ' + full(c.v); tipEl.appendChild(d);
  var r = chartEl.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  tipEl.style.opacity = 1;
  tipEl.style.left = Math.min(Math.max(4, x - tipEl.offsetWidth / 2), r.width - tipEl.offsetWidth - 4) + 'px';
  tipEl.style.top = Math.max(4, y - tipEl.offsetHeight - 12) + 'px';
}

function showMessage(t) { var s = chartEl.querySelector('svg'); if (s) s.remove(); msgEl.textContent = t; msgEl.style.display = 'flex'; }
function showDebug(d) {
  var b = document.getElementById('dbg');
  if (!b) { b = document.createElement('pre'); b.id = 'dbg'; b.style.cssText = 'position:absolute;left:4px;bottom:4px;max-width:60%;max-height:45%;overflow:auto;margin:0;padding:6px 8px;background:#FFF8E6;border:1px solid #E5D3A8;border-radius:6px;font:11px/1.5 monospace;direction:ltr;text-align:left;z-index:9'; document.body.appendChild(b); }
  b.textContent = 'rows: ' + (d.data || []).length + '\n' + (d.columns || []).map(function (c, i) { return i + ': ' + (c.label || c.name) + ' [' + c.type + ']'; }).join('\n') + '\nrow0: ' + JSON.stringify((d.data || [])[0]);
}

var rt; new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(function () { render(false); }, 80); }).observe(chartEl);

if (inVA) showMessage('في انتظار البيانات من SAS VA…');
else {
  // معاينة خارج VA فقط
  window.postMessage({ resultName: 'preview',
    columns: [{ name: 'ent', label: 'الجهة المبلغة', type: 'string' }, { name: 'n', label: 'عدد البلاغات', type: 'number' }],
    data: [['البنوك', 3180], ['الصرافة', 610], ['شركات التمويل', 420], ['التأمين', 260], ['القطاع غير المالي', 342]] }, '*');
}
</script>
</body>
</html>
