<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحات تقصّي</title>
<!--
  SAS Visual Analytics – Data-Driven Content (DDC) — صفحة رئيسية بشكل «خريطة روابط»
  - عدّل اللوحات وروابطها في DASHBOARDS.
  - الشعاران أعلى اليسار: logo-1.png و logo-2.png بجانب الملف (أو غيّر CONFIG.topLogos).
  - شعار تقصّي في المركز: ضع الصورة باسم taqasi-logo.png بجانب الملف (أو غيّر CONFIG.centerLogo).
  - Roles → Variables (اختياري): مقياس واحد (مثل عدد البلاغات) يظهر تحت الشعار.
  - الخط Almarai: من Google Fonts، أو من مجلد fonts/ بجانب الملف إن وُجد.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Almarai Local';font-weight:300;src:url('fonts/Almarai-Light.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:400;src:url('fonts/Almarai-Regular.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:700;src:url('fonts/Almarai-Bold.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:800;src:url('fonts/Almarai-ExtraBold.ttf') format('truetype')}
  :root{
    --deep:#1C3F2D;      /* خلفية الصفحة */
    --green:#28543B;     /* أخضر الهوية */
    --gold:#B8955A;
    --gold-l:#DCC9A3;
    --mist:#C9DACF;      /* نص ثانوي */
    --line:rgba(220,201,163,.32);
    --font:'Almarai','Almarai Local','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);color:#fff;font-family:var(--font)}
  body{overflow:hidden}
  #page{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:clamp(18px,4vh,44px) clamp(20px,4.4vw,48px) clamp(12px,2.6vh,28px);position:relative;overflow:hidden}

  /* ===== الخلفية ===== */
  #bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(110px,19vh,210px);z-index:0;pointer-events:none}
  .head,.map{position:relative;z-index:1}

  /* ===== العنوان ===== */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;position:relative;z-index:2}
  .ttl{max-width:620px}
  .sys{font-size:clamp(12px,1.4vh,15px);font-weight:700;color:var(--gold-l);margin:0 0 clamp(6px,1.3vh,14px);padding-right:14px;border-right:4px solid var(--gold);line-height:1.3}
  h1{margin:0;font-size:clamp(30px,5.9vh,64px);font-weight:800;line-height:1.12;letter-spacing:0}
  .lead{margin:clamp(6px,1.5vh,16px) 0 0;font-size:clamp(12.5px,1.5vh,16px);font-weight:300;color:var(--mist);line-height:1.8;max-width:520px}

  .logos{display:flex;align-items:center;gap:clamp(14px,2vw,22px);flex-shrink:0}
  .logos .sep{width:1px;align-self:stretch;min-height:56px;background:rgba(220,201,163,.45)}
  .lg{height:clamp(52px,7.5vh,82px);min-width:clamp(52px,7.5vh,82px);display:flex;align-items:center;justify-content:center}
  .lg img{max-height:100%;max-width:150px;display:block;object-fit:contain}
  .lg.ph{border:1px dashed rgba(255,255,255,.35);border-radius:12px;color:var(--mist);font-size:11px;padding:0 12px;text-align:center}

  /* ===== الخريطة ===== */
  .map{position:relative;margin:8px 0 0;min-height:0}
  .map svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .rings circle{fill:none;stroke:rgba(255,255,255,.055);stroke-width:1;vector-effect:non-scaling-stroke}
  .lk{stroke:var(--line);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke;transition:stroke .2s,stroke-width .2s}
  .lk.on{stroke:var(--gold);stroke-width:2.5}

  .core{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(120px,19vh,200px);height:clamp(120px,19vh,200px);border-radius:50%;
        background:var(--green);border:2px solid var(--gold);box-shadow:0 0 0 12px rgba(184,149,90,.08),0 0 0 26px rgba(184,149,90,.04);
        display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;z-index:2;padding:18px}
  .core img{max-width:68%;max-height:62%;display:block;object-fit:contain}
  .core .ph{font-size:13px;color:var(--mist);border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:18px 14px;line-height:1.6}
  .core .cnt{font-size:13px;font-weight:700;color:var(--mist);direction:rtl}
  .core .cnt b{font-weight:800;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}

  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:180px;
        text-decoration:none;color:#fff;z-index:3;cursor:pointer;outline:none;border-radius:14px;padding:6px}
  .dot{width:clamp(52px,7.2vh,78px);height:clamp(52px,7.2vh,78px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--deep);
       border:1.5px solid var(--gold-l);color:#fff;transition:background .2s,color .2s,transform .2s,border-color .2s}
  .node b{font-size:clamp(13px,1.5vh,16px);font-weight:700;text-align:center;line-height:1.4}
  .node:hover .dot,.node:focus-visible .dot,.node.on .dot{background:var(--gold);border-color:var(--gold);color:var(--deep);transform:scale(1.07)}
  .node:focus-visible{box-shadow:0 0 0 2px var(--gold-l)}
  .node.soon{cursor:default}
  .node.soon .dot{border-style:dashed;opacity:.6}
  .node.soon b::after{content:' (قريبًا)';font-weight:400;color:var(--mist);font-size:13px}

  .cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,90%);text-align:center;z-index:2;min-height:52px}
  .cap .t{font-size:15px;font-weight:700;color:var(--gold-l);margin-bottom:4px}
  .cap .d{font-size:14px;font-weight:300;color:var(--mist);line-height:1.7}

  /* حركة التحميل: رسم الخطوط مرة واحدة */
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .anim .lk{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s cubic-bezier(.3,.7,.2,1) forwards}
  .anim .node{opacity:0;animation:pop .45s ease-out forwards}
  @media (prefers-reduced-motion: reduce){ .anim .lk{animation:none;stroke-dasharray:none;stroke-dashoffset:0} .anim .node{animation:none;opacity:1} }

  /* شاشات صغيرة: قائمة بدل الخريطة */
  @media (max-width:760px){
    #page{padding:28px 20px 0} h1{font-size:40px} .head{flex-direction:column-reverse;align-items:flex-start}
    .map{min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:24px;overflow:auto}
    .map svg.links,.cap{display:none}
    .core{position:static;transform:none;margin:0 auto 12px;width:150px;height:150px}
    .node{position:static;transform:none;flex-direction:row;width:auto;gap:14px;justify-content:flex-start}
    .anim .node{animation:none;opacity:1}
    .dot{width:56px;height:56px}
  }
</style>
</head>
<body>
<div id="page">
  <svg id="bg" aria-hidden="true"></svg>
  <svg id="sky" viewBox="0 0 1000 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <header class="head">
    <div class="ttl">
      <p class="sys">منظومة تقصّي</p>
      <h1>لوحات التقارير<br>والمؤشرات</h1>
      <p class="lead">من البلاغ إلى القرار: اختر اللوحة التي تحتاجها للاطلاع على البلاغات والعمليات المالية والجهات المبلغة ومؤشرات الأداء.</p>
    </div>
    <div class="logos" id="logos" aria-label="الشعارات"></div>
  </header>

  <nav class="map anim" id="map" aria-label="لوحات التقارير">
    <svg class="links" id="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <g class="rings"><circle cx="50" cy="48" r="20"/><circle cx="50" cy="48" r="33"/><circle cx="50" cy="48" r="46"/></g>
    </svg>
    <div class="core" id="core"><img id="clogo" alt="شعار تقصّي"><span class="cnt" id="cnt"></span></div>
    <div class="cap" id="cap" aria-live="polite"><div class="d">مرّر المؤشر على أي لوحة لعرض محتواها، واضغط لفتحها.</div></div>
  </nav>

</div>

  report: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 17v-3M12 17v-6M15 17v-2"/>',
  money:  '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/>',
  bank:   '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  send:   '<path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5 20 4"/>',
  gauge:  '<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M4 20h16"/>',
  users:  '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>'
};
function icon(n) { return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || P.report) + '</svg>'; }

/* ============================ البناء ============================ */
var map = document.getElementById('map'), svg = document.getElementById('links'), cap = document.getElementById('cap');
var NS = 'http://www.w3.org/2000/svg', DEFAULT_CAP = cap.innerHTML;

DASHBOARDS.forEach(function (d, i) {
  var line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', CENTER.x); line.setAttribute('y1', CENTER.y);
  line.setAttribute('x2', d.x); line.setAttribute('y2', d.y);
  line.setAttribute('class', 'lk');
  line.style.animationDelay = (150 + i * 90) + 'ms';
  svg.appendChild(line);

  var live = !!d.url && !d.soon;
  var a = document.createElement(live ? 'a' : 'div');
  a.className = 'node' + (d.soon ? ' soon' : '');
  a.style.left = d.x + '%'; a.style.top = d.y + '%';
  a.style.animationDelay = (550 + i * 90) + 'ms';
  if (live) { a.href = d.url; a.target = CONFIG.target; a.rel = 'noopener'; }
  else if (!d.soon) { a.tabIndex = 0; a.setAttribute('role', 'link'); a.setAttribute('aria-disabled', 'true'); a.title = 'أضف رابط اللوحة في DASHBOARDS'; }
  a.innerHTML = '<span class="dot">' + icon(d.icon) + '</span><b></b>';
  a.querySelector('b').textContent = d.title;

  function on() {
    line.classList.add('on'); a.classList.add('on');
    cap.innerHTML = '<div class="t"></div><div class="d"></div>';
    cap.querySelector('.t').textContent = d.title + (live ? ' — اضغط للفتح' : '');
    cap.querySelector('.d').textContent = d.desc;
  }
  function off() { line.classList.remove('on'); a.classList.remove('on'); cap.innerHTML = DEFAULT_CAP; }
  a.addEventListener('mouseenter', on); a.addEventListener('mouseleave', off);
  a.addEventListener('focus', on); a.addEventListener('blur', off);
  if (live && CONFIG.target === '_top') a.addEventListener('click', function (e) {
    try { window.top.location.href = d.url; e.preventDefault(); } catch (x) { a.target = '_blank'; }
  });
  map.appendChild(a);
});

// طول كل خط بوحدات الشاشة لحركة الرسم
function measure() {
  var r = map.getBoundingClientRect();
  svg.querySelectorAll('.lk').forEach(function (l) {
    var dx = (l.x2.baseVal.value - l.x1.baseVal.value) * r.width / 100, dy = (l.y2.baseVal.value - l.y1.baseVal.value) * r.height / 100;
    l.style.setProperty('--len', Math.ceil(Math.hypot(dx, dy)) + 1);
  });
}
measure(); window.addEventListener('resize', measure);
setTimeout(function () { map.classList.remove('anim'); }, 2200); // بعد الحركة: حالة ثابتة

// شعار المركز
var clogo = document.getElementById('clogo');
clogo.onerror = function () { var ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '[شعار تقصّي]'; clogo.replaceWith(ph); };
clogo.src = CONFIG.centerLogo;

// الشعاران أعلى اليسار
var logos = document.getElementById('logos');
CONFIG.topLogos.forEach(function (src, i) {
  if (i) { var sep = document.createElement('span'); sep.className = 'sep'; logos.appendChild(sep); }
  var box = document.createElement('div'); box.className = 'lg';
  var im = new Image(); im.alt = '';
  im.onerror = function () { box.className = 'lg ph'; box.textContent = '[الشعار ' + (i + 1) + ']'; };
  box.appendChild(im); im.src = src; logos.appendChild(box);
});


/* ============================ الخلفية ============================ */
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(n, a, p) { var x = document.createElementNS(NS, n); for (var k in a) x.setAttribute(k, a[k]); if (p) p.appendChild(x); return x; }
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; } // ثابت في كل تحميل

  // 1) شبكة نقاط وخطوط خافتة
  var bg = document.getElementById('bg');
  function drawNetwork() {
    bg.innerHTML = '';
    if (!CONFIG.background.network) return;
    var W = bg.clientWidth || innerWidth, H = bg.clientHeight || innerHeight;
    bg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    seed = 7;
    var pts = [], n = Math.round(W * H / 15000);
    for (var i = 0; i < n; i++) pts.push([rnd() * W, rnd() * H, rnd()]);
    // قناع: الشبكة واضحة عند الأطراف وتختفي حول المركز
    var defs = el('defs', {}, bg), rg = el('radialGradient', { id: 'fade', cx: '50%', cy: '58%', r: '62%' }, defs);
    el('stop', { offset: '0', 'stop-color': '#000' }, rg); el('stop', { offset: '.42', 'stop-color': '#000' }, rg); el('stop', { offset: '1', 'stop-color': '#fff' }, rg);
    var mk = el('mask', { id: 'netmask' }, defs); el('rect', { width: W, height: H, fill: 'url(#fade)' }, mk);
    var net = el('g', { mask: 'url(#netmask)' }, bg);
    var gl = el('g', { stroke: 'rgba(220,201,163,.11)', 'stroke-width': 1, fill: 'none' }, net), edges = [];
    var maxD = Math.min(W, H) * 0.13;
    for (var a = 0; a < pts.length; a++) {
      var near = 0;
      for (var b = a + 1; b < pts.length && near < 3; b++) {
        var dx = pts[a][0] - pts[b][0], dy = pts[a][1] - pts[b][1], d = Math.hypot(dx, dy);
        if (d < maxD) { el('line', { x1: pts[a][0], y1: pts[a][1], x2: pts[b][0], y2: pts[b][1] }, gl); edges.push([pts[a], pts[b]]); near++; }
      }
    }
    var gd = el('g', {}, net);
    pts.forEach(function (p) { el('circle', { cx: p[0], cy: p[1], r: p[2] > .85 ? 2.4 : 1.4, fill: p[2] > .85 ? 'rgba(220,201,163,.35)' : 'rgba(255,255,255,.14)' }, gd); });

    // 3) نبضات ذهبية بطيئة على بعض الخطوط
    if (CONFIG.background.pulses && !reduce && edges.length) {
      for (var k = 0; k < 7; k++) {
        var e = edges[Math.floor(rnd() * edges.length)];
        var c = el('circle', { r: 2.2, fill: '#DCC9A3', opacity: 0 }, net);
        var dur = (5 + rnd() * 5).toFixed(1) + 's', begin = (rnd() * 6).toFixed(1) + 's';
        el('animateMotion', { dur: dur, begin: begin, repeatCount: 'indefinite', path: 'M' + e[0][0] + ',' + e[0][1] + ' L' + e[1][0] + ',' + e[1][1] }, c);
        el('animate', { attributeName: 'opacity', values: '0;.8;0', dur: dur, begin: begin, repeatCount: 'indefinite' }, c);
      }
    }
  }

  // 2) أفق الرياض
  function drawSkyline() {
    var sky = document.getElementById('sky'); sky.innerHTML = '';
    if (!CONFIG.background.skyline) return;
    seed = 21;
    // طبقة بعيدة
    var far = el('g', { fill: 'rgba(255,255,255,.032)' }, sky), x = 0;
    while (x < 1000) { var w = 14 + rnd() * 26, h = 22 + rnd() * 55; el('rect', { x: x, y: 170 - h, width: w - 2, height: h }, far); x += w; }
    // طبقة قريبة
    var near = el('g', { fill: 'rgba(255,255,255,.055)' }, sky); x = 0;
    while (x < 1000) {
      var w2 = 20 + rnd() * 34, h2 = 12 + rnd() * 38;
      if (!(x > 250 && x < 345) && !(x > 650 && x < 750)) el('rect', { x: x, y: 170 - h2, width: w2 - 3, height: h2 }, near);
      x += w2;
    }
    // برج الفيصلية
    el('path', { d: 'M276 170 L294 44 L300 8 L306 44 L324 170 Z' }, near);
    el('circle', { cx: 300, cy: 62, r: 7.5, fill: 'rgba(184,149,90,.38)' }, sky);
    // برج المملكة
    el('path', { d: 'M676 170 L679 70 Q682 28 689 2 L692 2 Q696 30 700 36 Q704 30 708 2 L711 2 Q718 28 721 70 L724 170 Z' }, near);
    el('rect', { x: 0, y: 169, width: 1000, height: 1, fill: 'rgba(220,201,163,.18)' }, sky);
  }

  drawNetwork(); drawSkyline();
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(drawNetwork, 120); });
})();

/* ======================= أرقام ديناميكية من VA ======================= */
var NUM = { number:1, double:1, numeric:1, integer:1, int:1, decimal:1, currency:1 };
var SAS_EPOCH = Date.UTC(1960, 0, 1);
function fmtName(c) { return String(c.format && (c.format.name || c.format.formatString) || '').toUpperCase(); }
function isDate(c) { return /date|time/.test(String(c.type || '').toLowerCase()) || /DATE|DTDATE|DATETIME|NLDAT/.test(fmtName(c)); }
function toDate(v, c) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    var dt = /DATETIME|DTDATE|NLDATM/.test(fmtName(c)) || Math.abs(v) > 1e6;
    var u = new Date(SAS_EPOCH + (dt ? v * 1000 : v * 86400000));
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes());
  }
  var t = Date.parse(String(v).replace(/^[A-Za-z]+,\s*/, '')); return isNaN(t) ? null : new Date(t);
}
function short(v) {
  var a = Math.abs(v), o = { maximumFractionDigits: 1 };
  if (a >= 1e9) return [(v / 1e9).toLocaleString('en-US', o), 'مليار'];
  if (a >= 1e6) return [(v / 1e6).toLocaleString('en-US', o), 'مليون'];
  return [Math.round(v).toLocaleString('en-US'), ''];
}
function valHTML(s) { var el = document.createElement('span'); el.textContent = s[0]; if (s[1]) { var sm = document.createElement('small'); sm.textContent = s[1]; el.appendChild(sm); } return el; }

window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d || typeof d !== 'object' || !d.hasOwnProperty('data')) return;
  var cols = Array.isArray(d.columns) ? d.columns : [], rows = Array.isArray(d.data) ? d.data : [];
  if (rows.length && !Array.isArray(rows[0])) rows = rows.map(function (o) { return cols.map(function (c) { return o[c.name]; }); });

  var measures = [], latest = null;
  cols.forEach(function (c, i) {
    if (isDate(c)) { rows.forEach(function (r) { var x = toDate(r[i], c); if (x && (!latest || x > latest)) latest = x; }); return; }
    if (!NUM[String(c.type || '').toLowerCase()]) return;
    var s = 0; rows.forEach(function (r) { var v = Number(r[i]); if (isFinite(v)) s += v; });
    measures.push({ label: c.label || c.name, sum: s });
  });

  // سطر العدد تحت الشعار
  var cnt = document.getElementById('cnt'); cnt.textContent = '';
  if (CONFIG.showCount && measures.length) {
    var b = document.createElement('b'); b.textContent = short(measures[0].sum).join(' ').trim();
    cnt.append(b, ' ' + measures[0].label);
  }
});

/* معاينة خارج VA فقط */
if (!(window.parent && window.parent !== window)) {
  window.postMessage({ resultName: 'preview',
    columns: [{ name: 'a', label: 'بلاغ', type: 'number' }],
    data: [[439]] }, '*');
}
