<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title banner – SAS VA DDC</title>
<!--
  SAS Visual Analytics – Data-Driven Content (DDC)
  شريط عنوان ديناميكي للوحة.

  نص العنوان من الرابط (نفس الملف لكل صفحة):
     title-ddc.html?title=لوحة البلاغات الشاملة&sub=الإدارة العامة للتحريات المالية

  Roles → Variables (كلها اختيارية، بأي ترتيب):
     - عمود تاريخ (مثل created_at_dttm)       ← «الفترة: من – إلى» حسب المرشحات
     - عمود تاريخ ثانٍ (مثل تاريخ تحميل البيانات) ← «آخر تحديث»
       (بدونه: «آخر تحديث» = أحدث قيمة في عمود التاريخ الأول)
     - مقياس (مثل عدد البلاغات)               ← «عدد البلاغات: 439»
     - عمود فئة (مثل نوع البلاغ)              ← يظهر كشارة إذا اختار المستخدم قيمة واحدة أو قيمتين

  بدون خلفية: نص + خط ذهبي فقط. ?theme=dark لنص داكن، ?info=0 لإخفاء الفترة والعدد.
  الخط: Almarai من Google Fonts، أو من مجلد fonts/ بجانب الملف (للشبكات المغلقة).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  /* نسخة محلية من الخط (ضع ملفات Almarai في مجلد fonts بجانب هذا الملف) */
  @font-face{font-family:'Almarai Local';font-weight:300;src:url('fonts/Almarai-Light.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:400;src:url('fonts/Almarai-Regular.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:700;src:url('fonts/Almarai-Bold.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:800;src:url('fonts/Almarai-ExtraBold.ttf') format('truetype')}

  :root{
    --gold:#B8955A; --ink:#FFFFFF; --ink-2:#D5E6DB;   /* نص أبيض فوق شريطك الأخضر */
    --font:'Almarai','Almarai Local','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:transparent!important;font-family:var(--font)}
  #banner{
    position:absolute;inset:0;box-sizing:border-box;background:transparent;color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(8px,2vw,20px);overflow:hidden
  }
  .titles{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;padding-right:16px}
  .titles::before{content:'';position:absolute;right:0;top:3px;bottom:3px;width:4px;border-radius:4px;background:var(--gold)}
  #title{margin:0;font-weight:800;font-size:clamp(18px,34vh,30px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
  #sub{font-weight:300;font-size:clamp(11px,16vh,14px);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-height:100%}
  .chip{display:flex;align-items:center;gap:6px;font-size:clamp(11px,14vh,13px);white-space:nowrap;color:var(--ink-2)}
  .chip b{font-weight:700;color:var(--ink)}
  .chip .k{font-weight:400}
  .chip.gold b{color:var(--gold)}
  .chip svg{flex-shrink:0;color:var(--gold)}
  .num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
  .ltr{direction:ltr}
  @media (max-width:700px){ .chips .opt{display:none} }
  @media (max-height:60px){ #sub{display:none} }
</style>
</head>
<body>
<div id="banner">
  <div class="titles">
    <h1 id="title">لوحة البلاغات الشاملة</h1>
    <div id="sub"></div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<script>
/* ============================ الإعدادات ============================ */
var CONFIG = {
  title: 'لوحة البلاغات الشاملة',  // يُستبدل بـ ?title= في الرابط
  subtitle: '',                    // يُستبدل بـ ?sub=
  theme: 'light',                  // 'light' = نص أبيض (فوق خلفية داكنة) | 'dark' = نص داكن (فوق خلفية فاتحة) أو ?theme=
  showInfo: true,                  // الفترة/آخر تحديث/العدد بجانب العنوان، أو ?info=0
  countLabel: null,                // اسم شارة العدد؛ null = تسمية المقياس من VA
  maxCategoryChips: 2,             // تظهر قيم الفئة كشارات إذا كان عددها ≤ هذا الرقم
  dateLocale: 'ar-SA-u-ca-gregory-nu-latn', // أشهر عربية، تقويم ميلادي، أرقام لاتينية
  showTime: true                   // إظهار الوقت مع «آخر تحديث»
};

/* ======================= إعدادات من الرابط ======================= */
var qs = new URLSearchParams(location.search);
if (qs.get('title')) CONFIG.title = qs.get('title');
if (qs.get('sub') !== null) CONFIG.subtitle = qs.get('sub');
if (qs.get('theme')) CONFIG.theme = qs.get('theme');
if (qs.get('info') === '0') CONFIG.showInfo = false;
if (qs.get('color')) document.documentElement.style.setProperty('--ink', qs.get('color'));
if (CONFIG.theme === 'dark') { document.documentElement.style.setProperty('--ink', '#1A1F1C'); document.documentElement.style.setProperty('--ink-2', '#5B635E'); }
document.getElementById('title').textContent = CONFIG.title;
document.title = CONFIG.title;
var subEl = document.getElementById('sub');
subEl.textContent = CONFIG.subtitle; subEl.style.display = CONFIG.subtitle ? '' : 'none';

var chipsEl = document.getElementById('chips');
var DEBUG = qs.get('debug') === '1';

/* ======================= استقبال البيانات من VA ======================= */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d || typeof d !== 'object' || !d.hasOwnProperty('data')) return;
  if (DEBUG) console.log('DDC title payload', d);
  renderChips(Array.isArray(d.columns) ? d.columns : [], Array.isArray(d.data) ? d.data : []);
});

/* ============================ التواريخ ============================ */
var SAS_EPOCH_MS = -315619200000; // 1960-01-01 بالنسبة لـ 1970-01-01
var MON = { JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11 };
function toDate(v, col) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    if (Math.abs(v) > 1e11) return new Date(v);                        // ميلي ثانية
    var fmt = (col && col.format && (col.format.name || col.format.formatString) || '').toUpperCase();
    var isDT = /DATETIME|DTDATE|NLDATM|TIME/.test(fmt) || Math.abs(v) > 1e6;
    var u = new Date(SAS_EPOCH_MS + (isDT ? v * 1000 : v * 86400000)); // ثوانٍ أو أيام SAS
    // قيم SAS بلا منطقة زمنية: اعرضها كما هي دون إزاحة توقيت المتصفح
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes(), u.getUTCSeconds());
  }
  var s = String(v).trim();
  var m = s.match(/^(\d{1,2})([A-Za-z]{3})(\d{4})(?::(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); // 21JUL2026:22:56:50
  if (m && MON[m[2].toUpperCase()] !== undefined) return new Date(+m[3], MON[m[2].toUpperCase()], +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  var t = Date.parse(s.replace(/^[A-Za-z]+,\s*/, '')); // يقبل "Tuesday, 21 July 2026 22:56:50"
  return isNaN(t) ? null : new Date(t);
}
function fmtDate(d, withTime) {
  var o = { day: 'numeric', month: 'long', year: 'numeric' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; o.hour12 = false; }
  try { return d.toLocaleString(CONFIG.dateLocale, o); } catch (x) { return d.toISOString().slice(0, withTime ? 16 : 10).replace('T', ' '); }
}
function hasTime(d) { return d.getHours() || d.getMinutes() || d.getSeconds(); }

/* ============================ الشارات ============================ */
var NUM = { number:1, double:1, numeric:1, integer:1, int:1, decimal:1, currency:1 };
var ICON = {
  cal: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  file: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  tag: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>'
};
function chip(icon, key, valueHTML, cls) {
  var c = document.createElement('div'); c.className = 'chip' + (cls ? ' ' + cls : '');
  c.innerHTML = ICON[icon] + (key ? '<span class="k"></span>' : '') + '<b></b>';
  if (key) c.querySelector('.k').textContent = key;
  c.querySelector('b').innerHTML = valueHTML;
  chipsEl.appendChild(c);
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[ch]; }); }

function renderChips(cols, rows) {
  chipsEl.innerHTML = '';
  if (!CONFIG.showInfo) return;
  if (rows.length && !Array.isArray(rows[0])) rows = rows.map(function (o) { return cols.map(function (c) { return o[c.name]; }); });

  // تصنيف الأعمدة
  var dateCols = [], numCol = -1, catCol = -1;
  cols.forEach(function (c, i) {
    var t = String(c.type || '').toLowerCase();
    var f = String(c.format && (c.format.name || c.format.formatString) || '').toUpperCase();
    if (/date|time/.test(t) || /DATE|DTDATE|DATETIME|DDMMYY|MMDDYY|YYMMDD|NLDAT|MONYY|WEEKDATE|WORDDATE/.test(f)) { dateCols.push(i); return; }
    if (NUM[t]) { if (numCol < 0) numCol = i; return; }
    // نص قد يكون تاريخًا منسقًا
    var sample = rows.length ? rows[0][i] : null;
    if (sample && typeof sample === 'string' && toDate(sample) && /\d{4}/.test(sample)) { dateCols.push(i); return; }
    if (catCol < 0) catCol = i;
  });

  // 1) الفترة حسب المرشحات
  var minD = null, maxD = null;
  if (dateCols.length) {
    rows.forEach(function (r) { var d = toDate(r[dateCols[0]], cols[dateCols[0]]); if (!d) return; if (!minD || d < minD) minD = d; if (!maxD || d > maxD) maxD = d; });
    if (minD) {
      var same = minD.toDateString() === maxD.toDateString();
      chip('cal', 'الفترة', same ? '<span class="num">' + esc(fmtDate(minD)) + '</span>'
        : '<span class="num">' + esc(fmtDate(minD)) + '</span> – <span class="num">' + esc(fmtDate(maxD)) + '</span>');
    }
  }

  // 2) آخر تحديث
  var upd = null;
  if (dateCols.length > 1) rows.forEach(function (r) { var d = toDate(r[dateCols[1]], cols[dateCols[1]]); if (d && (!upd || d > upd)) upd = d; });
  else upd = maxD;
  if (upd) chip('clock', 'آخر تحديث', '<span class="num">' + esc(fmtDate(upd, CONFIG.showTime && hasTime(upd))) + '</span>', 'opt');

  // 3) العدد
  if (numCol >= 0) {
    var sum = 0; rows.forEach(function (r) { var v = Number(r[numCol]); if (isFinite(v)) sum += v; });
    chip('file', (CONFIG.countLabel || cols[numCol].label || cols[numCol].name), '<span class="num ltr">' + sum.toLocaleString('en-US') + '</span>', 'gold');
  }

  // 4) قيم الفئة المختارة (عند تصفية قيمة أو قيمتين)
  if (catCol >= 0) {
    var seen = {}, vals = [];
    rows.forEach(function (r) { var v = r[catCol]; if (v === null || v === '' || v === undefined) return; v = String(v).trim(); if (!seen[v]) { seen[v] = 1; vals.push(v); } });
    if (vals.length && vals.length <= CONFIG.maxCategoryChips) chip('tag', cols[catCol].label || cols[catCol].name, esc(vals.join('، ')), 'opt');
  }
}
</script>
</body>
</html>
