<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trend Squiggle - DDC</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #wrapper {
    width: 100%;
    height: 100%;
    display: flex;
  }
  #sparkSvg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<div id="wrapper">
  <svg id="sparkSvg"></svg>
</div>

<script>
/* ===========================================================
   CONFIG
=========================================================== */
var UP_COLOR   = "#16a34a"; // green
var DOWN_COLOR = "#dc2626"; // red
var ZERO_COLOR = "#6b7280"; // grey, used only when value is exactly 0

var LINE_WIDTH = 2;
var SHOW_AREA_FILL = true;
var SHOW_END_MARKER = true;
var MARKER_RADIUS = 3.5;
var MARKER_RING = true;

// Normalized (0-1) point shape for the decorative squiggle, rising
// left-to-right. This is NOT plotted from real data — it is driven
// entirely by the sign of the single measure value, same logic as
// the circle badge. Flip vertically for the "down" version.
var SHAPE_POINTS = [0.55, 0.42, 0.50, 0.30, 0.38, 0.18, 0.26, 0.05];

var lastValue = null;

/* ===========================================================
   HELPERS
=========================================================== */
function catmullRomPath(points) {
  if (points.length < 2) return "";
  var d = "M" + points[0][0] + "," + points[0][1] + " ";
  for (var i = 0; i < points.length - 1; i++) {
    var p0 = points[i === 0 ? 0 : i - 1];
    var p1 = points[i];
    var p2 = points[i + 1];
    var p3 = points[i + 2 === points.length ? i + 1 : i + 2];
    var cp1x = p1[0] + (p2[0] - p0[0]) / 6;
    var cp1y = p1[1] + (p2[1] - p0[1]) / 6;
    var cp2x = p2[0] - (p3[0] - p1[0]) / 6;
    var cp2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += "C" + cp1x + "," + cp1y + " " + cp2x + "," + cp2y + " " + p2[0] + "," + p2[1] + " ";
  }
  return d;
}

/* ===========================================================
   RENDER
=========================================================== */
function renderTrend(value) {
  lastValue = value;

  var wrap = document.getElementById("wrapper");
  var W = wrap.clientWidth || 140;
  var H = wrap.clientHeight || 48;

  var svg = document.getElementById("sparkSvg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);

  var pad = 5;
  var plotW = W - pad * 2;
  var plotH = H - pad * 2;

  var isUp = value > 0;
  var isZero = value === 0;
  var color = isZero ? ZERO_COLOR : (isUp ? UP_COLOR : DOWN_COLOR);

  // Build the point list: rising shape for positive, mirrored (falling)
  // for negative, flat line for exactly zero.
  var n = SHAPE_POINTS.length;
  var points = SHAPE_POINTS.map(function (t, i) {
    var normY = isZero ? 0.5 : (isUp ? t : (1 - t)); // mirror vertically for "down"
    var x = pad + (plotW * i) / (n - 1);
    var y = pad + normY * plotH;
    return [x, y];
  });

  var linePath = catmullRomPath(points);

  var defs = "";
  var areaEl = "";
  if (SHOW_AREA_FILL) {
    var gid = "sparkFill";
    defs += '<linearGradient id="' + gid + '" x1="0%" y1="0%" x2="0%" y2="100%">' +
              '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.28"/>' +
              '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +
            '</linearGradient>';
    var last = points[points.length - 1];
    var first = points[0];
    var areaPath = linePath + " L" + last[0] + "," + (pad + plotH) + " L" + first[0] + "," + (pad + plotH) + " Z";
    areaEl = '<path d="' + areaPath + '" fill="url(#' + gid + ')" stroke="none"/>';
  }

  var lineEl = '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="' + LINE_WIDTH + '" stroke-linecap="round" stroke-linejoin="round"/>';

  var markerEl = "";
  if (SHOW_END_MARKER) {
    var ep = points[points.length - 1];
    if (MARKER_RING) {
      markerEl += '<circle cx="' + ep[0] + '" cy="' + ep[1] + '" r="' + (MARKER_RADIUS * 2.4) + '" fill="' + color + '" opacity="0.18"/>';
    }
    markerEl += '<circle cx="' + ep[0] + '" cy="' + ep[1] + '" r="' + MARKER_RADIUS + '" fill="#fff" stroke="' + color + '" stroke-width="2"/>';
  }

  svg.innerHTML = "<defs>" + defs + "</defs>" + areaEl + lineEl + markerEl;
}

/* ===========================================================
   SAS Visual Analytics Data-Driven Content messaging
=========================================================== */
function handleVAMessage(event) {
  var msg = event.data;
  if (!msg || typeof msg !== "object" || !msg.data || !msg.columns) return;

  try {
    var measColIdx = -1;
    msg.columns.forEach(function (col, i) {
      if (col.type === "number" && measColIdx === -1) measColIdx = i;
    });

    if (measColIdx === -1 || !msg.data.length) return;

    // Uses the first row's value — no category needed, same as the
    // circle badge: one measure, sign decides direction and color.
    var value = Number(msg.data[0][measColIdx]) || 0;
    renderTrend(value);
  } catch (e) {
    console.error("Error parsing VA message:", e);
  }
}

window.addEventListener("message", handleVAMessage);

if (window.ResizeObserver) {
  var ro = new ResizeObserver(function () {
    if (lastValue !== null) renderTrend(lastValue);
  });
  ro.observe(document.getElementById("wrapper"));
} else {
  window.addEventListener("resize", function () {
    if (lastValue !== null) renderTrend(lastValue);
  });
}

/* Initial render with sample data (works standalone in a browser too) */
renderTrend(12.4);
</script>

</body>
</html>
