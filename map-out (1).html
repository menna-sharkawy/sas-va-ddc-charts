<title>خريطة التحويلات للخارج – SAS VA DDC</title>
<!--
  SAS Visual Analytics – Data-Driven Content (DDC)
  خريطة الأموال المحوَّلة من المملكة إلى الدول المستقبِلة.
  حدود الدول مضمّنة في الملف (Natural Earth) — تعمل بدون إنترنت.

  Roles → Variables (بالترتيب):
    1) بلد المستقبل (للخارج) أو بلد المرسل (للداخل) — بالعربية أو الإنجليزية أو كود ISO
    2) المبلغ  : Sum of اجمالي الحركات
    3) اختياري: Distinct count of رقم العملية

  إعدادات من الرابط (اختيارية):
    ?dir=in           اتجاه الداخل (من الدول إلى المملكة)؛ الافتراضي حسب الملف
    &title=...        عنوان داخل الكائن
    &panel=0          إخفاء قائمة الدول الجانبية
    &arcs=0           خريطة ألوان فقط بدون خطوط التحويل
    &unit=ر.س         وحدة المبلغ
  الخط: Almarai من مجلد fonts/ بجانب الملف أو من Google Fonts.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Almarai Local';font-weight:400;src:url('fonts/Almarai-Regular.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:700;src:url('fonts/Almarai-Bold.ttf') format('truetype')}
  @font-face{font-family:'Almarai Local';font-weight:800;src:url('fonts/Almarai-ExtraBold.ttf') format('truetype')}
  :root{
    --green:#1F5B3A; --green-2:#2F8055; --gold:#B8955A; --gold-d:#8C6B34; --sand:#EFE6D2;
    --sea:#F2F6F3; --land:#E1E7E2; --border:#FFFFFF; --ink:#1A1F1C; --ink2:#4A524D; --muted:#6B736E; --line:#E6E9E6;
    --font:'Almarai','Almarai Local','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#FFFFFF;color:var(--ink);font-family:var(--font);overflow:hidden}
  #wrap{position:absolute;inset:0;display:flex;gap:14px;padding:12px}
  #mapbox{position:relative;flex:1 1 auto;min-width:0;border-radius:14px;overflow:hidden;background:var(--sea)}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block}
  #title{position:absolute;top:12px;right:16px;margin:0;font-size:16px;font-weight:800;color:var(--ink);z-index:2;padding-right:12px;border-right:4px solid var(--gold);line-height:1.3}
  #title[hidden]{display:none}
  .country{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
  .country.dest{cursor:pointer;transition:opacity .2s}
  .country.sa{fill:var(--green)}
  .arc{fill:none;stroke:var(--gold);stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55;transition:opacity .2s}
  .flow{fill:none;stroke:#fff;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1.5 14;opacity:.95;animation:flow 2.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-31}}
  .bub{fill:var(--gold);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .2s}
  .lbl{font-family:var(--font);fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-linejoin:round;pointer-events:none}
  .lbl .n{font-weight:800}
  .lbl .v{fill:var(--gold-d);font-weight:700}
  .riy{fill:#fff;stroke:var(--green);vector-effect:non-scaling-stroke}
  .pulse{fill:none;stroke:var(--green);vector-effect:non-scaling-stroke;animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
  .dim .arc,.dim .bub,.dim .country.dest{opacity:.18}
  .dim .on{opacity:1!important}
  .dim .flow{opacity:.15} .dim .flow.on{opacity:.95}

  #panel{flex:0 0 270px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#F6F8F6;border-radius:12px;padding:10px 12px}
  .kpi .k{font-size:12px;color:var(--ink2)}
  .kpi .v{font-size:20px;font-weight:800;line-height:1.35;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:11.5px;font-weight:400;color:var(--muted);margin-inline-start:4px}
  #list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-left:2px}
  .row{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;align-items:center;padding:8px 8px;border-radius:10px;cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:start;width:100%}
  .row:hover,.row.on{background:var(--hl,#F4EFE4)}
  .row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .row .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .row .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .am{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .am small{font-weight:400;color:var(--muted);font-size:11px;margin-inline-start:3px}
  .row .br{grid-column:2 / 4;height:5px;border-radius:3px;background:#EEF1EE;overflow:hidden}
  .row .br i{display:block;height:100%;background:var(--gold);border-radius:3px}
  .row .ct{grid-column:2 / 4;font-size:11.5px;color:var(--muted);margin-top:-2px}
  .note{font-size:11.5px;color:var(--muted);line-height:1.6}
  .legend{position:absolute;left:12px;bottom:10px;z-index:2;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.88);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--ink2)}
  .legend .scale{width:120px;height:8px;border-radius:4px;background:linear-gradient(to left,var(--gold),var(--sand))}
  .legend .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
  .legend .sa{display:flex;align-items:center;gap:6px}
  .legend .sa i{width:10px;height:10px;border-radius:2px;background:var(--green)}

  #tip{position:fixed;pointer-events:none;background:#1A1F1C;color:#fff;font-size:12.5px;line-height:1.7;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:240px}
  #tip b{font-weight:800}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8;padding:20px;white-space:pre-line;background:#fff;z-index:5}
  @media (max-width:720px){ #wrap{flex-direction:column} #panel{flex:0 0 auto;max-height:40%} .kpis{display:none} .legend{display:none} }
  @media (prefers-reduced-motion: reduce){ .flow,.pulse{animation:none} .flow{display:none} }
</style>
</head>

    </div>
    <div id="list" role="list"></div>
    <div class="note" id="note"></div>
  </aside>
</div>

if (qs.get('title')) { var tl = document.getElementById('title'); tl.textContent = qs.get('title'); tl.hidden = false; }

var inVA = window.parent && window.parent !== window;
var state = { resultName: null, m: null, sel: null };
var $ = function (id) { return document.getElementById(id); };
var NS = 'http://www.w3.org/2000/svg';
function el(t, a, p) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }

/* ===================== مطابقة أسماء الدول ===================== */
function norm(s) {
  return String(s || '').trim().toLowerCase()
    .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/(^|\s)ال/g, '$1').replace(/[^؀-ۿa-z0-9]/g, '');
}
var INDEX = {};
GEO.c.forEach(function (c, i) { [c.a, c.e, c.i].forEach(function (n) { if (n) INDEX[norm(n)] = i; }); });
var ALIAS = { 'امارات': 'ARE', 'اماراتعربيهمتحده': 'ARE', 'uae': 'ARE', 'مملكهعربيهسعوديه': 'SAU', 'سعوديه': 'SAU', 'ksa': 'SAU',
  'بريطانيا': 'GBR', 'انجلترا': 'GBR', 'uk': 'GBR', 'امريكا': 'USA', 'ولاياتمتحده': 'USA', 'usa': 'USA', 'هونجكونج': 'HKG', 'هونغكونغ': 'HKG',
  'سوريا': 'SYR', 'ايران': 'IRN', 'روسيا': 'RUS', 'كوريا': 'KOR', 'هولندا': 'NLD' };
Object.keys(ALIAS).forEach(function (a) { var iso = ALIAS[a]; GEO.c.forEach(function (c, i) { if (c.i === iso) INDEX[a] = i; }); });
// أسماء مختصرة على الخريطة فقط (القائمة والتلميح بالاسم الكامل)
var SHORT = {}; SHORT[norm('الإمارات العربية المتحدة')] = 'الإمارات'; SHORT[norm('المملكة المتحدة')] = 'بريطانيا'; SHORT[norm('الولايات المتحدة')] = 'أمريكا'; SHORT[norm('جمهورية الكونغو الديمقراطية')] = 'الكونغو';
function findCountry(name) { var k = norm(name); return k in INDEX ? INDEX[k] : -1; }
var SA_IDX = GEO.c.findIndex(function (c) { return c.i === 'SAU'; });
// نقطة الانطلاق/الوصول في وسط المملكة (وليس مدينة بعينها)
if (SA_IDX >= 0) GEO.riy = [GEO.c[SA_IDX].x, GEO.c[SA_IDX].y];

/* ===================== الاتصال مع VA ===================== */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d || typeof d !== 'object' || !d.hasOwnProperty('data')) return;
  if (qs.get('debug') === '1') console.log('DDC payload', d);
  state.resultName = d.resultName; state.sel = null;
  var m = build(Array.isArray(d.columns) ? d.columns : [], Array.isArray(d.data) ? d.data : []);
  if (m.error) { state.m = null; msg(m.error); post({ resultName: state.resultName, message: m.error }); return; }
  state.m = m; $('msg').style.display = 'none'; render();
});
function post(o) {
  if (!inVA || !state.resultName) return;
  var t = '*'; try { if (document.referrer) t = new URL(document.referrer).origin; } catch (x) {}
  window.parent.postMessage(o, t);
}

var NUM = { number:1, double:1, numeric:1, integer:1, int:1, decimal:1, currency:1 };
function build(cols, rows) {
  if (rows.length && !Array.isArray(rows[0])) rows = rows.map(function (o) { return cols.map(function (c) { return o[c.name]; }); });
  var cat = -1, meas = [];
  cols.forEach(function (c, i) { if (NUM[String(c.type || '').toLowerCase()]) meas.push(i); else if (cat < 0) cat = i; });
  if (cat < 0 || !meas.length) return { error: 'أسند في Roles → Variables:\n1) ' + TX.role + '\n2) مجموع المبلغ\n3) عدد العمليات (اختياري)' };
  var by = {}, domestic = 0, unknown = [];
  rows.forEach(function (r, ri) {
    var name = r[cat]; if (name === null || name === undefined || String(name).trim() === '') return;
    name = String(name).trim();
    var a = Number(r[meas[0]]) || 0, n = meas.length > 1 ? Number(r[meas[1]]) || 0 : null;
    var idx = findCountry(name);
    if (idx === SA_IDX) { domestic += a; return; }
    var key = idx >= 0 ? 'c' + idx : 'u' + name;
    if (!by[key]) by[key] = { name: name, idx: idx, amt: 0, cnt: n === null ? null : 0, rows: [] };
    by[key].amt += a; if (n !== null) by[key].cnt += n; by[key].rows.push(ri);
  });
  var list = Object.keys(by).map(function (k) { return by[k]; }).filter(function (d) { return d.amt > 0; }).sort(function (a, b) { return b.amt - a.amt; });
  if (!list.length) return { error: TX.none };
  var total = list.reduce(function (s, d) { return s + d.amt; }, 0);
  list.forEach(function (d) { d.share = d.amt / total; d.geo = d.idx >= 0 ? GEO.c[d.idx] : null; d.onMap = !!(d.geo && d.geo.in); });
  return { list: list, total: total, max: list[0].amt, min: list[list.length - 1].amt, domestic: domestic, measure: cols[meas[0]].label };
}

/* ===================== التنسيق ===================== */
function money(v) {
  var a = Math.abs(v), o = { maximumFractionDigits: 1 };
  if (a >= 1e9) return [(v / 1e9).toLocaleString('en-US', o), 'مليار'];
  if (a >= 1e6) return [(v / 1e6).toLocaleString('en-US', o), 'مليون'];
  if (a >= 1e3) return [(v / 1e3).toLocaleString('en-US', o), 'ألف'];
  return [Math.round(v).toLocaleString('en-US'), ''];
}
function moneyTxt(v) { var m = money(v); return m[0] + (m[1] ? ' ' + m[1] : ''); }
function mix(a, b, t) { var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); }), pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
  return 'rgb(' + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * t); }).join(',') + ')'; }
function shade(d, m) { return mix(C0, C1, Math.sqrt(d.amt / m.max)); }

/* ===================== الرسم ===================== */
var svg = $('map');
function render() {
  var m = state.m; if (!m) return;
  svg.innerHTML = '';
  var box = $('mapbox').getBoundingClientRect(); if (box.width < 50 || box.height < 50) return;

  // تكبير تلقائي على المملكة والدول الظاهرة
  var pts = [[GEO.riy[0] - 60, GEO.riy[1] - 50], [GEO.riy[0] + 70, GEO.riy[1] + 60]];
  m.list.forEach(function (d) { if (d.onMap) pts.push([d.geo.x, d.geo.y]); });
  var minX = Math.min.apply(null, pts.map(function (p) { return p[0]; })) - 165, maxX = Math.max.apply(null, pts.map(function (p) { return p[0]; })) + 165;
  var minY = Math.min.apply(null, pts.map(function (p) { return p[1]; })) - 60, maxY = Math.max.apply(null, pts.map(function (p) { return p[1]; })) + 60;
  var w = maxX - minX, h = maxY - minY, ar = box.width / box.height;
  if (w / h < ar) { var nw = h * ar; minX -= (nw - w) / 2; w = nw; } else { var nh = w / ar; minY -= (nh - h) / 2; h = nh; }
  if (w > GEO.w) { var s = GEO.w / w; w = GEO.w; h *= s; minX = 0; }
  minX = Math.max(0, Math.min(minX, GEO.w - w)); minY = Math.max(0, Math.min(minY, GEO.h - h));
  svg.setAttribute('viewBox', [minX, minY, w, h].map(function (v) { return v.toFixed(1); }).join(' '));
  var k = w / box.width;  // وحدات الخريطة لكل بكسل

  var root = el('g', { class: state.sel !== null ? 'dim' : '' }, svg);
  el('rect', { x: 0, y: 0, width: GEO.w, height: GEO.h, fill: 'var(--sea)' }, root);
  var land = el('g', {}, root);
  var destByIdx = {}; m.list.forEach(function (d, i) { if (d.idx >= 0) destByIdx[d.idx] = i; });
  GEO.c.forEach(function (c, i) {
    if (!c.d) return;
    var p = el('path', { d: c.d, class: 'country' }, land);
    if (i === SA_IDX) p.setAttribute('class', 'country sa');
    else if (i in destByIdx) { var dd = m.list[destByIdx[i]]; p.setAttribute('class', 'country dest' + (state.sel === destByIdx[i] ? ' on' : '')); p.style.fill = shade(dd, m); hook(p, destByIdx[i]); }
  });

  var arcs = el('g', {}, root), flows = el('g', {}, root), bubs = el('g', {}, root), labels = el('g', {}, root);
  var R = GEO.riy;
  m.list.forEach(function (d, i) {
    if (!d.onMap) return;
    var x = d.geo.x, y = d.geo.y, on = state.sel === i ? ' on' : '';
    if (SHOW_ARCS) {
      var dx = x - R[0], dy = y - R[1], dist = Math.hypot(dx, dy), bend = Math.min(0.32, 40 / dist + 0.18);
      var cx = (R[0] + x) / 2 + dy * bend * (dx < 0 ? 1 : -1), cy = (R[1] + y) / 2 - Math.abs(dx) * bend - dist * 0.06;
      var dpath = DIR === 'in'
        ? 'M' + x + ',' + y + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + R[0] + ',' + R[1]   // من الدولة إلى المملكة
        : 'M' + R[0] + ',' + R[1] + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + x + ',' + y;
      var sw = 1.5 + 7 * Math.sqrt(d.share);
      var a = el('path', { d: dpath, class: 'arc' + on, 'stroke-width': sw }, arcs); hook(a, i);
      el('path', { d: dpath, class: 'flow' + on, 'stroke-width': Math.max(1.4, sw * 0.45), style: 'animation-delay:' + (-i * 0.4) + 's' }, flows);
    }
    var r = (5 + 15 * Math.sqrt(d.amt / m.max)) * k;
    var b = el('circle', { cx: x, cy: y, r: r, class: 'bub' + on }, bubs); hook(b, i);

    // التسمية: بعيدًا عن المملكة
    var side = x < R[0] ? -1 : 1, fs = 12.5 * k;
    var short = SHORT[norm(d.name)] || d.name;
    var lw = Math.max(short.length, moneyTxt(d.amt).length) * fs * 0.6 + r + 8 * k;
    if (side < 0 && x - lw < minX + 4 * k) side = 1;
    else if (side > 0 && x + lw > minX + w - 4 * k) side = -1;
    var t = el('text', { x: x + side * (r + 6 * k), y: y - 2 * k, class: 'lbl', 'text-anchor': side < 0 ? 'end' : 'start', 'font-size': fs, 'stroke-width': 3.2 * k, direction: 'ltr' }, labels);
    var t1 = el('tspan', { class: 'n' }, t); t1.textContent = short;
    var t2 = el('tspan', { class: 'v', x: x + side * (r + 6 * k), dy: fs * 1.25 }, t); t2.textContent = moneyTxt(d.amt);
  });

  // المملكة
  el('circle', { cx: R[0], cy: R[1], r: 6 * k, class: 'pulse', 'stroke-width': 2 }, root);
  el('circle', { cx: R[0], cy: R[1], r: 5 * k, class: 'riy', 'stroke-width': 3 }, root);
  var rl = el('text', { x: R[0], y: R[1] + 20 * k, class: 'lbl', 'text-anchor': 'middle', 'font-size': 12 * k, 'stroke-width': 3 * k }, root);
  var rs = el('tspan', { class: 'n' }, rl); rs.textContent = 'السعودية';

  renderPanel(m);
}

function hook(node, i) {
  node.addEventListener('mousemove', function (ev) { tip(ev, state.m.list[i]); });
  node.addEventListener('mouseleave', function () { $('tip').style.opacity = 0; });
  node.addEventListener('click', function (ev) { ev.stopPropagation(); select(i); });
}

function renderPanel(m) {
  var tm = money(m.total);
  $('kTot').innerHTML = ''; $('kTot').append(tm[0]); var sm = document.createElement('small'); sm.textContent = (tm[1] ? tm[1] + ' ' : '') + UNIT; $('kTot').appendChild(sm);
  $('kCnt').textContent = m.list.length.toLocaleString('en-US');
  $('lgMax').textContent = moneyTxt(m.max); $('lgMin').textContent = moneyTxt(m.min);
  var L = $('list'); L.innerHTML = '';
  m.list.forEach(function (d, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'row' + (state.sel === i ? ' on' : ''); b.setAttribute('role', 'listitem');
    var mm = money(d.amt);
    b.innerHTML = '<span class="r"></span><span class="nm"></span><span class="am"></span><span class="br"><i></i></span><span class="ct"></span>';
    b.querySelector('.r').textContent = i + 1;
    b.querySelector('.nm').textContent = d.name;
    b.querySelector('.am').textContent = mm[0]; var s2 = document.createElement('small'); s2.textContent = mm[1]; b.querySelector('.am').appendChild(s2);
    b.querySelector('.br i').style.width = (d.amt / m.max * 100) + '%';
    b.querySelector('.ct').textContent = Math.round(d.share * 100) + '% من الإجمالي' + (d.cnt !== null ? ' · ' + Math.round(d.cnt).toLocaleString('en-US') + ' عملية' : '') + (d.onMap ? '' : ' · خارج نطاق الخريطة');
    b.onmouseenter = function () { hi(i); }; b.onmouseleave = function () { hi(null); };
    b.onclick = function (ev) { ev.stopPropagation(); select(i); };
    L.appendChild(b);
  });
  $('note').textContent = m.domestic > 0 ? TX.dom + moneyTxt(m.domestic) + ' ' + UNIT : '';
}

function hi(i) {
  if (state.sel !== null) return;
  var root = svg.firstChild; if (!root) return;
  root.setAttribute('class', i === null ? '' : 'dim');
  ['arc', 'flow', 'bub'].forEach(function (c) { svg.querySelectorAll('.' + c).forEach(function (n) { n.classList.remove('on'); }); });
  svg.querySelectorAll('.country.dest').forEach(function (n) { n.classList.remove('on'); });
  if (i === null) return;
  var d = state.m.list[i]; var onMap = state.m.list.filter(function (x, j) { return x.onMap && j <= i; }).length - 1;
  if (d.onMap) { ['.arc', '.flow', '.bub'].forEach(function (s) { var n = svg.querySelectorAll(s)[onMap]; if (n) n.classList.add('on'); }); }
  svg.querySelectorAll('.country.dest').forEach(function (n) { if (n.style.fill && n.__i === i) n.classList.add('on'); });
}

function tip(ev, d) {
  var t = $('tip'); t.innerHTML = '<b></b><div></div><div></div>';
  t.querySelector('b').textContent = d.name;
  t.querySelectorAll('div')[0].textContent = moneyTxt(d.amt) + ' ' + UNIT + ' (' + Math.round(d.share * 100) + '%)';
  t.querySelectorAll('div')[1].textContent = d.cnt !== null ? Math.round(d.cnt).toLocaleString('en-US') + ' عملية' : '';
  t.style.opacity = 1;
  var w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(Math.max(6, ev.clientX - w / 2), innerWidth - w - 6) + 'px';
  t.style.top = (ev.clientY - h - 12 < 6 ? ev.clientY + 16 : ev.clientY - h - 12) + 'px';
}

function select(i) {
  state.sel = state.sel === i ? null : i;
  post({ resultName: state.resultName, selections: (state.sel === null ? [] : state.m.list[i].rows).map(function (r) { return { row: r }; }) });
  render();
}
document.addEventListener('click', function () { if (state.sel !== null) { state.sel = null; post({ resultName: state.resultName, selections: [] }); render(); } });
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });
function msg(t) { $('msg').textContent = t; $('msg').style.display = 'flex'; }

if (inVA) msg('في انتظار البيانات من SAS VA…');
else if (DIR === 'in') window.postMessage({ resultName: 'preview',
  columns: [{ name: 'c', label: 'بلد المرسل', type: 'string' }, { name: 'a', label: 'اجمالي الحركات', type: 'number' }, { name: 'n', label: 'عدد العمليات', type: 'number' }],
  data: [['الإمارات العربية المتحدة', 4726627.5, 27], ['تركيا', 918125, 1], ['المملكة العربية السعودية', 368727500, 2293]] }, '*');
else window.postMessage({ resultName: 'preview',
  columns: [{ name: 'c', label: 'بلد المستقبل', type: 'string' }, { name: 'a', label: 'اجمالي الحركات', type: 'number' }, { name: 'n', label: 'عدد العمليات', type: 'number' }],
  data: [['مصر', 11510000, 28], ['الإمارات العربية المتحدة', 6930000, 25], ['الأردن', 6900000, 19], ['الهند', 4330000, 11], ['باكستان', 3650000, 9], ['هونغ كونغ', 180000, 1], ['جورجيا', 110000, 1], ['المملكة العربية السعودية', 120000000, 900]] }, '*');
</script>
